<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私をかたちづくる7冊</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <header>
        <h1>私をかたちづくる7冊</h1>
    </header>
    <main>
        <div class="books-container">
            <svg id="books-stack" width="300" height="400"></svg>
            <div id="book-detail" class="book-detail">
                <div class="detail-content">
                    <img id="detail-cover" src="" alt="book cover" class="detail-cover">
                    <div class="detail-info">
                        <h2 id="detail-title"></h2>
                        <p><strong>著者:</strong> <span id="detail-author"></span></p>
                        <p><strong>発行日:</strong> <span id="detail-year"></span></p>
                        <p><strong>出版社:</strong> <span id="detail-publisher"></span></p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
