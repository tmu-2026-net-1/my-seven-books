<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私をかたちづくる七冊</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="gallery-space">
        <header class="page-header">
            <h1>SEVEN BOOKS THAT SHAPED ME</h1>
            <p>私をかたちづくる七冊</p>
        </header>

        <div class="reading-area" id="reading-area">
            <div class="book-3d-wrapper">
                
                <div class="book-right-side">
                    <div class="page-thickness-bottom"></div>
                    <div class="page-thickness-right"></div>
                    <div class="page-surface">
                        <div id="top-comment" class="comment-text"></div>
                    </div>
                </div>

                <div class="book-cover-hinge" id="book-cover-hinge">
                    <div class="cover-front" id="cover-front"></div>
                    <div class="cover-inner">
                        <span class="top-index" id="top-index"></span>
                        <h2 id="top-title" class="top-title"></h2>
                        <p id="top-author" class="author-text"></p>
                        <p id="top-isbn" class="isbn-text"></p>
                    </div>
                </div>

            </div>
        </div>

        <div class="bookshelf-wrapper">
            <div class="shelf-top-surface"></div>
            <div id="shelf-track" class="shelf-track"></div>
            <div class="shelf-front-edge"></div>
        </div>
    </div>
</body>
</html>
