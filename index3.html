<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>私をかたちづくる７冊</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --text-primary: #e8e8e8;
      --text-secondary: #888;
      --accent: #c8a96e;
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Helvetica Neue', sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    header {
      margin-bottom: 60px;
      border-left: 2px solid var(--accent);
      padding-left: 16px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.05em;
    }

    header p {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 6px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .book-list-container {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .book-list-item {
      display: grid;
      grid-template-columns: 2rem 80px 1fr auto;
      align-items: center;
      gap: 0 20px;
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
    }

    .book-list-item:first-child {
      border-top: 1px solid var(--border);
    }

    .book-num {
      font-size: 0.75rem;
      color: var(--accent);
    }

    /* 書影 */
    .book-cover {
      width: 80px;
      height: 110px;
      object-fit: cover;
      background: var(--surface);
      border-radius: 2px;
    }

    /* 書影がない場合のプレースホルダー */
    .book-cover-placeholder {
      width: 80px;
      height: 110px;
      background: var(--surface);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    .book-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .title {
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.5;
    }

    .author {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .year {
      font-size: 0.75rem;
      color: var(--text-secondary);
      align-self: flex-start;
    }

    footer {
      margin-top: 60px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

  <header>
    <h1>私をかたちづくる７冊</h1>
    <p>Takeru Yoshimura</p>
  </header>

  <div id="book-list"></div>

  <footer>吉村武留</footer>

  <script>

    const MY_ISBNS = [
      "978-4-274-50715-1",
      "978-4-7661-4005-7",
      "978-4-7562-5352-1",
      "978-4-7942-2178-0",
      "978-4-7631-3802-6",
      "978-4-478-06480-1",
      "978-4-7973-9996-7",
    ];

    // -----------------------------------------------
    // Google Books API から書影URLを取得する関数
    // isbn を受け取って、thumbnail の URL を返す
    // 画像がない場合は null を返す
    // -----------------------------------------------
    async function fetchCover(isbn) {
      // ハイフンを除去してからAPIに渡す
      const isbnClean = isbn.replace(/-/g, "");
      const response = await fetch(
        `https://www.googleapis.com/books/v1/volumes?q=isbn:${isbnClean}`
      );
      const data = await response.json();

      // items が存在して、imageLinks があれば thumbnail を返す
      // ?. は「存在すれば取り出す」演算子（なければ undefined）
      return data.items?.[0]?.volumeInfo?.imageLinks?.thumbnail ?? null;
    }

    async function loadBooks() {

      // ① GAS API から全件取得
      const response = await fetch("https://script.google.com/macros/s/AKfycbzcbPFBgkWfbA4BsX9EruALPgvwk1mkE-1mwX4Nv6aG1eBkQXIYtOtg9Y7tEYX5zypo/exec");
      const data = await response.json();

      // ② 自分の7冊だけ抽出
      const myBooks = data.filter(d => MY_ISBNS.includes(d.isbn));

      // ③ 新しい順にソート
      const sortedBooks = [...myBooks].sort((a, b) => b.year - a.year);

      // ④ HTMLに表示
      const container = document.querySelector("#book-list");
      container.innerHTML = "";

      const booklist = document.createElement("div");
      booklist.classList = "book-list-container";
      container?.appendChild(booklist);

      // -----------------------------------------------
      // ⑤ 1冊ずつ書影を取得して表示
      // forEach の中で async/await を使うために
      // for...of ループを使う
      // -----------------------------------------------
      let index = 0;
      for (const book of sortedBooks) {

        // Google Books API で書影を取得
        const coverUrl = await fetchCover(book.isbn);

        // 書影があれば <img>、なければプレースホルダーを表示
        const coverHtml = coverUrl
          ? `<img class="book-cover" src="${coverUrl}" alt="${book.title}">`
          : `<div class="book-cover-placeholder">no image</div>`;

        const item = document.createElement("div");
        item.classList = "book-list-item";
        item.innerHTML = `
          <div class="book-num">${String(index + 1).padStart(2, "0")}</div>
          ${coverHtml}
          <div class="book-info">
            <div class="title">${book.title}</div>
            <div class="author">${book.author}　／　${book.publisher}</div>
          </div>
          <div class="year">${book.year}</div>
        `;
        booklist?.appendChild(item);
        index++;
      }

    }

    loadBooks();

  </script>

</body>
</html>
