<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私をかたちづくる7冊</title>
  <link rel="stylesheet" href="style.css">
  <script type="module">
    import { cachedFetch } from './cached-fetch.js';

    const API_URL = "https://script.google.com/macros/s/AKfycbzcbPFBgkWfbA4BsX9EruALPgvwk1mkE-1mwX4Nv6aG1eBkQXIYtOtg9Y7tEYX5zypo/exec";

    async function showBookDetail() {
      const match = location.pathname.match(/book(\d+)\.html$/);
      const idx = match ? parseInt(match[1], 10) - 1 : 0;
      const data = await cachedFetch(API_URL);
      const myBooks = data.filter(d => d.name === "Kitasho");
      const book = myBooks[idx];
      if (!book) {
        document.getElementById("book-detail").innerHTML = "<p>本の情報が見つかりません。</p>";
        return;
      }
      let coverHtml = "";
      if (book.isbn) {
        const url = `https://cover.openbd.jp/${book.isbn}.jpg`;
        coverHtml = `<img class='book-detail-cover' src='${url}' alt='cover' onerror="this.onerror=null;this.outerHTML='<div class=\'book-detail-cover empty\'>NO COVER</div>';">`;
      } else {
        coverHtml = `<div class='book-detail-cover empty'>NO COVER</div>`;
      }
      const myReview = [
        '私が一番世界設定にハマったゲーム「ゼノブレイド」の設定資料集である。',
        'この本を読んで、ゼノブレイドの世界はもちろん、ゲームの中で語られなかった設定や、ゲーム制作の裏話なども知ることができた。',
        'これを読み読んで読み込んで中学生時代を過ごしたのは忘れられない思い出となっている。',
        '面白いゲームなので是非やってみてほしい！'
      ].join('\n');
      const amazonUrl = book.isbn
        ? `https://www.amazon.co.jp/s?k=${book.isbn}`
        : 'https://www.amazon.co.jp/';
      document.getElementById("book-detail").innerHTML = `
        <div class="book-detail-vertical">
          ${coverHtml}
          <div class="book-detail-info">
            <div class="book-detail-title">${book.title || ""}</div>
            <div class="book-detail-author">${book.author || ""}</div>
            <div class="book-detail-publisher">${book.publisher || ""} <span style=\"color:#bfa76f;\">/</span> <span class="book-detail-year">${book.year || ""}</span></div>
            <div class="book-detail-isbn">ISBN: ${book.isbn || ""}</div>
          </div>
        </div>
        <section style="max-width:400px;margin:2.5rem auto 2.5rem auto;background:rgba(255,255,255,0.85);border-radius:12px;box-shadow:0 2px 12px rgba(80,60,30,0.10);padding:1.5rem 1.5rem 1.2rem 1.5rem;">
          <h2 style="font-size:1.1rem;color:#5a3c1a;margin-bottom:0.3rem;font-weight:bold;">my review</h2>
          <div style="color:#5a3c1a;font-size:1rem;white-space:pre-wrap;">${myReview}</div>
        </section>
        <a href="${amazonUrl}" target="_blank" id="amazon-link-btn" style="position:fixed;right:2.5vw;bottom:2.5vw;z-index:1000;background:#ff9900;color:#fff;font-weight:bold;padding:0.8em 1.5em;border-radius:2em;box-shadow:0 2px 8px rgba(80,60,30,0.13);text-decoration:none;font-size:1.1rem;transition:background 0.2s;">Amazonで見る</a>
      `;
    }
    window.addEventListener('DOMContentLoaded', showBookDetail);
  </script>
</head>
<body>
  <header class="page-title-center">
    <h1 class="page-title">Book 3 紹介ページ</h1>
  </header>
  <main>
    <div id="book-detail"></div>
  </main>
  <footer>
    <button class="back-to-shelf" onclick="location.href='index.html'">本棚にもどる</button>
    <div style="margin-top:0.7rem;color:#8b7a5a;font-size:0.95rem;">北庄琴音</div>
  </footer>
</body>
</html>
