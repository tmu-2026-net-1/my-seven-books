<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>十角館の殺人</title>
	<link rel="stylesheet" href="style.css">
</head>
<body class="book-detail-page">
	<header>
		<h1>十角館の殺人</h1>
	</header>
	<main class="book-detail-main">
		<section class="book-detail-layout">
			<div class="frame">
				<div class="frame-inner">
					<img src="https://covers.openlibrary.org/b/isbn/9784062758574-L.jpg" alt="十角館の殺人 表紙">
					<div class="frame-empty" style="display:none;">表紙画像</div>
				</div>
				<div class="frame-caption">綾辻行人 / 講談社文庫</div>
			</div>
			<article class="book-essay">
				<h2>この本について</h2>
                <p>作者: 綾辻行人</p>
                <p>出版社: 講談社文庫</p>
                <p>クローズドサークルもののミステリー小説</p>
				<p>この本は大学の時に友達に勧められて読んだ本です。</p>
				<p>今までの人生で自主的に小説を買ったことは全然なかったのですが、読み終わった瞬間に次の本も買ってしまいました。</p>
				<p>本当に面白くて、この本がきっかけでミステリーにハマり、自分で小説を買うようになり、色々なミステリー小説を読むようになりました。</p>
				<p>この本を読まなければミステリー小説に関わることはなかったと思うので、人生を変えたと言ってもいいと思っています。</p>
				<a class="back-link" href="index.html">トップに戻る</a>
			</article>
		</section>
	</main>
	<script>
		(function () {
			const params = new URLSearchParams(window.location.search);
			const cover = params.get('cover');
			const title = params.get('title');
			const author = params.get('author');
			const publisher = params.get('publisher');
			const img = document.querySelector('.frame-inner img');
			const caption = document.querySelector('.frame-caption');
			const heading = document.querySelector('h1');

			if (cover && img) img.src = cover;
			if (title && heading) {
				heading.textContent = title;
				document.title = title;
			}
			if (caption) {
				const parts = [author, publisher].filter(Boolean);
				if (parts.length > 0) caption.textContent = parts.join(' / ');
			}
		})();
	</script>
</body>
</html>
