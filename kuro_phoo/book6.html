<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>学園ベビーシッターズ 1巻</title>
	<link rel="stylesheet" href="style.css">
</head>
<body class="book-detail-page">
	<header>
		<h1>学園ベビーシッターズ 1巻</h1>
	</header>
	<main class="book-detail-main">
		<section class="book-detail-layout">
			<div class="frame">
				<div class="frame-inner">
					<img src="https://covers.openlibrary.org/b/isbn/9784592191711-L.jpg" alt="学園ベビーシッターズ 1巻 表紙">
					<div class="frame-empty" style="display:none;">表紙画像</div>
				</div>
				<div class="frame-caption">時計野はり / 白泉社</div>
			</div>
			<article class="book-essay">
				<h2>この本について</h2>
				<p>この漫画は私が受験生の時に出会いました。</p>
                <p>作者: 時計野はり</p>
                <p>出版社: 白泉社</p>
                <p>子供達が可愛い癒しの日常系漫画</p>
				<p>表紙や題名から分かる通り、この漫画は高校生がベビーシッターのようなことをして子供たちのお世話をするというほのぼのできるものです。</p>
				<p>私はこの本を読んでストレスを緩和させていました。</p>
				<p>受験期の殺伐とした感じをこの本を読んで無くすことができたので、本当にこの本に出会えてよかったなと思っています。</p>
				<p>ぜひみんなにも読んで癒されてほしいです。</p>
				<a class="back-link" href="index.html">トップに戻る</a>
			</article>
		</section>
	</main>
	<script>
		(function () {
			const params = new URLSearchParams(window.location.search);
			const cover = params.get('cover');
			const title = params.get('title');
			const author = params.get('author');
			const publisher = params.get('publisher');
			const img = document.querySelector('.frame-inner img');
			const caption = document.querySelector('.frame-caption');
			const heading = document.querySelector('h1');

			if (cover && img) img.src = cover;
			if (title && heading) {
				heading.textContent = title;
				document.title = title;
			}
			if (caption) {
				const parts = [author, publisher].filter(Boolean);
				if (parts.length > 0) caption.textContent = parts.join(' / ');
			}
		})();
	</script>
</body>
</html>
