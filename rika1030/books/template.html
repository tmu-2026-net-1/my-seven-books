<!DOCTYPE html>
<html lang="jp">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>本の詳細</title>
	<link rel="stylesheet" href="../style.css">
</head>
<body>
	<header>
		<h1 style="font-size:2.2rem; font-weight:700; letter-spacing:0.1em; margin:0;"><a href="../index.html" class="top-link">私をかたちづくる7冊</a></h1>
	</header>
	<main style="max-width: 100vw; margin: 0 auto; padding: 3.5rem 0 3rem 0; background: #f7f7f7; min-height: 100vh;">
		<div class="dot-frame" style="background:#fff;box-shadow:0 2px 16px #0002;border-radius:18px;padding:2.5rem 2rem;margin:2rem auto;max-width:480px;">
			<img id="book-image" src="" alt="" class="book-image" style="display:block;margin:0 auto 2rem auto;max-width:180px;max-height:260px;object-fit:cover;border-radius:8px;box-shadow:0 2px 8px #0001;">
			<h2 id="book-title" class="title" style="color:#222;font-weight:700;margin-bottom:0.5rem;text-align:center;"></h2>
			<div id="book-author" class="author" style="color:#666;font-size:0.97rem;text-align:center;margin-bottom:0.5rem;"></div>
			<div id="book-publisher" class="publisher" style="color:#aaa;font-size:0.85rem;text-align:center;"></div>
			<div id="book-year" class="year" style="color:#aaa;font-size:0.85rem;text-align:center;margin-bottom:1.2rem;"></div>
			<div id="book-isbn" style="color:#aaa;font-size:0.85rem;text-align:center;"></div>
			<div id="book-amazon" style="margin-top:1em;text-align:center;"></div>
			<section id="book-summary" style="margin-top:2.2rem;">
				<h3 style="color:#222;font-weight:700;margin-bottom:0.7rem;">あらすじ / 概要</h3>
				<div id="summary-body" style="color:#444;font-size:1rem;">あらすじ本文</div>
			</section>
			<section id="book-review" style="margin-top:2.2rem;">
				<h3 style="color:#222;font-weight:700;margin-bottom:0.7rem;">レビュー</h3>
				<div id="review-body" style="color:#444;font-size:1rem;">本文</div>
			</section>
			<section id="book-recommend" style="margin-top:2.2rem;">
				<h3 style="color:#222;font-weight:700;margin-bottom:0.7rem;">こんな人におすすめ</h3>
				<div id="recommend-body" style="color:#444;font-size:1rem;">おすすめ本文</div>
			</section>
		</div>
		<a href="../index.html" class="back-link">←トップページへ戻る</a>
	</main>
	<footer>
		<span style="font-size:1.1rem;">まちもとりか</span>
	</footer>
	<script src="book.js"></script>
</body>
</html>
